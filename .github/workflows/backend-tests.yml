# Backend suite (BD-03): pytest for the API, engine, desktop guard and desktop migrations.
name: backend-tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: System tools used by tests (poppler, qpdf)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils qpdf
      - run: python -m pip install -q -r requirements.txt
      - run: python -m pytest -q
