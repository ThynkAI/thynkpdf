name: desktop-release
# Builds the THYNKPDF desktop app (Electron shell + PyInstaller backend sidecar + static web export).
# Unsigned for now: see apps/desktop/README.md for SmartScreen / Gatekeeper notes and signing requirements.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["apps/desktop/**", ".github/workflows/desktop-release.yml"]

permissions:
  contents: write

jobs:
  backend-tests:
    uses: ./.github/workflows/backend-tests.yml
  web-e2e:
    uses: ./.github/workflows/web-e2e.yml

  build:
    needs: [backend-tests, web-e2e]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: win, artifact: THYNKPDF-Windows-x64 }
          - { os: macos-latest, target: mac, artifact: THYNKPDF-macOS-arm64 }
          - { os: macos-15-intel, target: mac, artifact: THYNKPDF-macOS-x64 }
          - { os: ubuntu-latest, target: linux, artifact: THYNKPDF-Linux-x64 }
    runs-on: ${{ matrix.os }}
    env:
      THYNKPDF_STATIC_EXPORT: "1"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Web app static export
        shell: bash
        run: |
          npx --yes pnpm@10.34.6 install --frozen-lockfile
          npx --yes pnpm@10.34.6 --filter @thynkpdf/web build
          test -f apps/web/out/index.html
      - name: Native deps for Intel Mac (pikepdf 10 / cryptography 50 ship no macOS x86_64 wheels)
        if: matrix.os == 'macos-15-intel'
        shell: bash
        run: |
          brew install qpdf
          echo "CPATH=$(brew --prefix qpdf)/include" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$(brew --prefix qpdf)/lib" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=$(sw_vers -productVersion | cut -d. -f1).0" >> "$GITHUB_ENV"
          # cryptography 50 has no x86_64 macOS wheel either: build it with OpenSSL linked statically, so PyInstaller's bundled libssl can't shadow it
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"
      - name: Backend sidecar (PyInstaller)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          python apps/desktop/build/build_sidecar.py
      - name: Packaged smoke test (route set == source, features, key/Host/Origin, restart, permissions)
        shell: bash
        run: python apps/desktop/build/smoke_sidecar.py
      - name: Package installer
        working-directory: apps/desktop
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npx electron-builder --${{ matrix.target }} --publish never
      - name: Verify mac bundle (arch + ad-hoc signature)
        if: matrix.target == 'mac'
        working-directory: apps/desktop
        shell: bash
        run: |
          APP=$(find dist -maxdepth 2 -name '*.app' | head -1)
          echo "app: $APP"
          lipo -archs "$APP/Contents/MacOS/THYNKPDF"
          lipo -archs "$APP/Contents/Resources/thynkpdf-server/thynkpdf-server"
          if [ "${{ matrix.os }}" = "macos-latest" ]; then
            lipo -archs "$APP/Contents/Resources/thynkpdf-server/thynkpdf-server" | grep -qw arm64
          fi
          codesign -dv --verbose=4 "$APP" 2>&1
          codesign -dv --verbose=4 "$APP/Contents/Resources/thynkpdf-server/thynkpdf-server" 2>&1
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute -vv "$APP" || echo "spctl rejects (expected for ad-hoc / not notarized)"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.AppImage

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out }
      - name: Checksums (BD-21)
        run: |
          mkdir -p dist && find out -type f -exec cp {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          body: |
            THYNKPDF ${{ github.ref_name }} — free PDF editor. No account, no sign-in: the app opens a private local workspace on your computer.

            Known limitations: Windows build is unsigned (SmartScreen warning) and the macOS build is ad-hoc signed, not notarized (right-click → Open). Verify downloads with SHA256SUMS. Share links and signature requests need a hosted server and are off in the desktop app; visual signing on this device works.
