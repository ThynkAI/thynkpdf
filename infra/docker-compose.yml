# NOT RUN on the build box (no docker available). Untested.
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_DB: thynkpdf, POSTGRES_USER: thynkpdf, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}" }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "thynkpdf"], interval: 5s }
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: "${MINIO_ROOT_USER}", MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD}" }
    ports: ["9000:9000", "9001:9001"]
  api:
    build: { context: .., dockerfile: infra/Dockerfile }
    env_file: .env
    command: uvicorn thynkpdf_api.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    depends_on: [postgres, redis, minio]
  worker:
    build: { context: .., dockerfile: infra/Dockerfile }
    env_file: .env
    command: python apps/worker/worker.py
    depends_on: [postgres, redis]
    mem_limit: 1g
    cpus: 1.0
    read_only: true
    tmpfs: [/tmp]
