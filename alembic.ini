[alembic]
script_location = migrations
prepend_sys_path = apps/api packages/pdf-engine packages/storage packages/signatures packages/ai
sqlalchemy.url = sqlite:///./migrate-check.db
[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(message)s
